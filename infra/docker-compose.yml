# Local PostgreSQL for development. Start: `mise run db:up`. Stop: `mise run db:down`.
# Values come from .env (mise loads it). R4 §5.1.
name: seo-advisor

services:
  db:
    # Pin the full tag. The tests use the same image (apps/api/tests/conftest.py).
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"  # this machine only
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker.
      # Mount the parent: the old /var/lib/postgresql/data path breaks start-up.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
