# Tool versions and project tasks. See PLAN.md, step 0.2.
# Each task names the step that makes its input files. A task fails with a
# clear error until that step is done.

[tools]
python = "3.14.8"
uv = "0.12.23"
node = "24.21.0"
pnpm = "12.9.1"
gitleaks = "8.30.1"
prek = "0.5.5"

[env]
_.file = ".env"

# --- Setup -------------------------------------------------------------------

[tasks.setup]
description = "Install tools, Python and web deps, .env, database and seed sites"
run = [
  "mise install",
  "test -f .env || cp .env.example .env",
  "uv sync --locked",
  "pnpm install --frozen-lockfile",
  "mise run db:seed",
]

# --- Run ---------------------------------------------------------------------

[tasks.dev]
description = "Start the database, the API (:8000) and the web app (:5173)"
depends = ["dev:api", "dev:web"]

[tasks."dev:api"]
description = "Start the API with reload on code changes"
depends = ["db:migrate"]
run = "uv run uvicorn seo_advisor.main:app_from_env --factory --reload --reload-dir apps/api/src --host 127.0.0.1 --port 8000"

[tasks."dev:web"]
description = "Start the web app; it sends /api and /health to the API"
run = "pnpm --filter web dev"

# --- Quality -----------------------------------------------------------------

[tasks.check]
description = "Lint, type checks and tests"
depends = ["lint", "typecheck", "test", "test:web"]

[tasks.lint]
description = "Lint, format and import-rule checks"
run = [
  "uv run ruff check --quiet",
  "uv run ruff format --check --quiet",
  "uv run lint-imports",
  "pnpm --filter web lint",
]

[tasks.typecheck]
description = "Type checks (mypy --strict)"
run = ["uv run mypy", "pnpm -r typecheck"]

[tasks.test]
description = "Tests; add a path after -- for one feature"
run = "uv run pytest -q"

[tasks."test:web"]
description = "Web app tests (Vitest)"
run = "pnpm --filter web test"

[tasks.audit]
description = "Check dependencies for known vulnerabilities"
# Audits the exact pins and hashes in uv.lock. Our own package is not on PyPI,
# so --no-emit-project leaves it out of the list.
run = ["pnpm audit", "uv export --locked --quiet --all-groups --no-emit-project --format requirements-txt | uv run pip-audit --strict --disable-pip --require-hashes -r /dev/stdin"]

# --- Database ----------------------------------------------------------------

[tasks."db:up"]
description = "Start PostgreSQL and wait until it is healthy (step 0.4)"
run = "docker compose -f infra/docker-compose.yml up -d --wait"

[tasks."db:down"]
description = "Stop PostgreSQL; the data stays in its volume (step 0.4)"
run = "docker compose -f infra/docker-compose.yml down"

[tasks."db:migrate"]
description = "Apply migrations (step 0.4)"
depends = ["db:up"]
run = "uv run alembic upgrade head"

[tasks."db:seed"]
description = "Save the sites in infra/sites/*.toml (unchanged files change no rows)"
depends = ["db:migrate"]
run = "uv run python -m seo_advisor.features.sites.cli infra/sites/*.toml"

# --- Features ----------------------------------------------------------------

[tasks."inventory:discover"]
description = "Print a site's pages from its sitemaps (read-only, live)"
run = "uv run python -m seo_advisor.features.inventory.cli"

# --- API client and evals ----------------------------------------------------

[tasks.gen-client]
description = "Export OpenAPI and make the TypeScript client again"
run = [
  "uv run python -m seo_advisor.openapi packages/api-client/openapi.json",
  "pnpm --filter api-client generate",
]

[tasks.evals]
description = "LLM evals on recorded data (step 0.11)"
run = "uv run python -m evals"

# --- Documents ---------------------------------------------------------------

[tasks."docs:pdf"]
description = "Build the requirements PDF again (docs group + Google Chrome)"
dir = "requirements/diagrams"
# Docs-only packages: playwright (uv group "docs"), @hpcc-js/wasm-graphviz (root
# package.json). render.py prints with the installed /usr/bin/google-chrome.
run = [
  "uv run --group docs python build_requirements_pdf.py .",
  "uv run --group docs python render.py requirements.html ../seo-advisor-requirements.pdf",
]
